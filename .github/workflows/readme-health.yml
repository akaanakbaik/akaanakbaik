name: README Health Check

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/readme-health.yml

concurrency:
  group: readme-health
  cancel-in-progress: true

jobs:
  validate-readme-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check critical README assets and badge URLs
        run: |
          set -euo pipefail

          urls=(
            "https://img.shields.io/github/stars/akaanakbaik/akaanakbaik?label=Repo%20Stars&style=for-the-badge&color=ffd700&logo=github"
            "https://github.com/akaanakbaik/akaanakbaik/actions/workflows/update-metrics.yml/badge.svg?branch=main"
            "https://github.com/akaanakbaik/akaanakbaik/actions/workflows/profile-metrics.yml/badge.svg?branch=main"
            "https://github.com/akaanakbaik/akaanakbaik/actions/workflows/snake.yml/badge.svg?branch=main"
            "https://github.com/akaanakbaik/akaanakbaik/actions/workflows/update-pinned.yml/badge.svg?branch=main"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/github-metrics.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/output/github-contribution-grid-snake.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/code-totals.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/stats-grid.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/lang-donut.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/lang-pareto.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/lang-radar.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/calendar.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/coding-age.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/coding-rhythm.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/top-repos.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/live-clock.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/motivation-quote.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/monthly-summary.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/github-stats.svg"
            "https://raw.githubusercontent.com/akaanakbaik/akaanakbaik/main/generated/top-langs.svg"
            "https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fakaanakbaik%2Fakaanakbaik%2Fmain%2Fbadges%2Ftotal-lines.json"
            "https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fakaanakbaik%2Fakaanakbaik%2Fmain%2Fbadges%2Ftotal-chars.json"
          )

          for url in "${urls[@]}"; do
            echo "Checking: $url"
            curl --fail --silent --show-error --location --head --retry 3 "$url" > /dev/null
          done
