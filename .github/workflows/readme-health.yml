name: README Health Check

on:
  schedule:
    - cron: '30 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - badges/**
      - generated/**
      - scripts/validate-readme.mjs
      - .github/workflows/readme-health.yml

concurrency:
  group: readme-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate README links and generated badge contracts
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/validate-readme.mjs
