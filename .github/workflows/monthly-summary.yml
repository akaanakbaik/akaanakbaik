name: Monthly AI Summary

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-summary
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate monthly AI activity summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
        run: node scripts/monthly-summary.mjs

      - name: Commit and push monthly summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/monthly-summary.svg stats/monthly-summary.md badges/monthly-commits.json badges/monthly-active-days.json badges/monthly-top-repo.json
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "chore(summary): publish monthly AI activity summary"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main --quiet && git push --quiet; then
              echo "Pushed monthly summary"
              exit 0
            fi
            echo "Push rejected, retry $i/5..."
            sleep 3
          done
          exit 1
