name: Update Pinned Repos

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: update-pinned
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate pinned repo cards from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
          PINNED_REPOS: portofoliov2,dastermv2,musika
        run: node scripts/pinned-repos.mjs

      - name: Commit and push pinned cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/pinned-*.svg
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "chore(metrics): update pinned repository cards"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main --quiet && git push --quiet; then
              echo "Pushed pinned cards"
              exit 0
            fi
            echo "Push rejected, retry $i/5..."
            sleep 3
          done
          exit 1
