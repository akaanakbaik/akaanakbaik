name: Update Pinned Repos

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: update-pinned
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate pinned repo cards from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
          PINNED_REPOS: portofoliov2,dastermv2,musika
        run: node scripts/pinned-repos.mjs

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(metrics): update pinned repository cards'
          file_pattern: 'generated/pinned-*.svg'
