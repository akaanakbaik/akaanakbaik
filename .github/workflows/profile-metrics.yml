name: Profile Metrics

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'badges/**'
      - 'stats/**'
      - 'generated/**'
      - 'github-metrics.svg'
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache repository clones for code totals
        uses: actions/cache@v5
        with:
          path: .cache/repos
          key: code-repos-${{ hashFiles('scripts/**') }}
          restore-keys: |
            code-repos-

      - name: Generate profile metrics, code totals and language charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
        run: node scripts/generate-profile-metrics.mjs

      - name: Commit and push generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges stats generated
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "chore(metrics): auto-update profile metrics, code totals, language charts and badges"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main --quiet && git push --quiet; then
              echo "Pushed generated metrics"
              exit 0
            fi
            echo "Push rejected, retry $i/5..."
            sleep 3
          done
          exit 1
