name: Profile Metrics

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'badges/**'
      - 'stats/**'
      - 'generated/**'
      - 'github-metrics.svg'
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache repository clones for code totals
        uses: actions/cache@v4
        with:
          path: .cache/repos
          key: code-repos-${{ hashFiles('scripts/**') }}
          restore-keys: |
            code-repos-

      - name: Generate profile metrics, code totals and language charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
        run: node scripts/generate-profile-metrics.mjs

      - name: Commit generated metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(metrics): auto-update profile metrics, code totals, language charts and badges'
          file_pattern: 'badges/*.json stats/* generated/*.svg'
          pull: '--rebase'
