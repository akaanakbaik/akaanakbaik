name: Profile Metrics

on:
  push:
    branches:
      - main
    paths-ignore:
      - badges/**
      - stats/**
      - generated/**
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: generated-assets-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test API retry resilience
        run: node scripts/test-reliability.mjs

      - name: Cache repository clones for code totals
        uses: actions/cache@v5
        with:
          path: .cache/repos
          key: code-repositories-${{ runner.os }}-${{ hashFiles('scripts/lib/loc.mjs') }}
          restore-keys: |
            code-repositories-${{ runner.os }}-

      - name: Generate authoritative profile metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
        run: node scripts/generate-profile-metrics.mjs

      - name: Verify complete Code Census
        run: node scripts/verify-code-census.mjs

      - name: Refresh clock, social badges and motivation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
        run: node scripts/live-clock.mjs

      - name: Refresh featured repository cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
          PINNED_REPOS: portofoliov2,dastermv2,musika
        run: node scripts/pinned-repos.mjs

      - name: Refresh rolling 30-day summary and badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: akaanakbaik
        run: node scripts/monthly-summary.mjs

      - name: Validate generated badge data and README links
        run: node scripts/validate-readme.mjs

      - name: Commit one consistent snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$RUNNER_TEMP/profile-snapshot"
          rm -rf "$snapshot"
          mkdir -p "$snapshot"
          cp -a badges stats generated "$snapshot/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf badges stats generated
            cp -a "$snapshot/badges" "$snapshot/stats" "$snapshot/generated" .
            git add badges stats generated
            if git diff --cached --quiet; then
              echo "No generated changes"
              exit 0
            fi
            git commit -m "chore(metrics): refresh profile snapshot"
            if git push origin HEAD:main; then
              echo "Published consistent metrics snapshot"
              exit 0
            fi
            echo "Publication retry ${attempt}/5 after remote advanced"
            git reset --hard origin/main
            sleep $((attempt * 5))
          done
          exit 1
