name: Profile Integrity

on:
  schedule:
    - cron: '45 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - badges/**
      - generated/**
      - scripts/**
      - .github/workflows/profile-integrity.yml

concurrency:
  group: profile-integrity
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$file"
          done

      - name: Check badge contracts and README references
        run: node scripts/validate-readme.mjs
