<text x="30" y="44" fill="#ffffff" font-size="25" font-weight="900" font-family="Inter,'Segoe UI',system-ui,sans-serif">Monthly AI Summary — August 2026</text>
<text x="30" y="66" fill="#94a3b8" font-size="12.5" font-family="Inter,'Segoe UI',system-ui,sans-serif">25 Jul – 24 Aug · auto-narrated from real commit data by our own AI engine</text>
<rect x="30" y="80" width="940" height="3.5" rx="1.75" fill="url(#msAccent)"/>
<text x="40" y="122" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">Selama 30 hari terakhir (25 Jul – 24 Aug), aku membuat 194 commit di 11 repositori dan aktif selama 19 hari —</text><text x="40" y="143" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">rata-rata 10.2 commit per hari aktif.</text><text x="40" y="178" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">Hari paling produktif adalah 02 Aug dengan 35 commit, dan Sun menjadi hari tersibuk dalam seminggu. Puncak aktivitas</text><text x="40" y="199" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">terjadi sekitar jam 20:00 WIB — aku paling produktif di malam hari (night owl mode).</text><text x="40" y="234" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">Repo paling sibuk bulan ini: akaanakbaik (127), kaboxv8 (18), portofoliov2 (17).</text><text x="40" y="269" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">Bahasa yang paling sering kupakai: TypeScript ×5, JavaScript ×3, Shell ×1.</text><text x="40" y="304" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">Selain itu aku juga membuka 2 pull request — terus berkontribusi dan berkolaborasi.</text><text x="40" y="339" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">Kesimpulan: bulan yang sangat produktif — energiku tinggi dan proyek terus bergerak maju. Terus ngoding, tetap</text><text x="40" y="360" fill="#cbd5e1" font-size="15" font-family="Inter,'Segoe UI',system-ui,sans-serif">semangat! 🚀</text>
