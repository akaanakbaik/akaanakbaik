<text x="40" y="152" fill="#f59e0b" font-size="110" font-weight="900" font-family="Inter,'Segoe UI',system-ui,sans-serif">“</text>
<circle cx="930" cy="56" r="34" fill="#f59e0b" opacity="0.14"/>
<text x="930" y="66" text-anchor="middle" fill="#f59e0b" font-size="20" font-weight="900" font-family="Inter,'Segoe UI',system-ui,sans-serif">#44</text>
<text x="70" y="118" fill="#ffffff" font-size="21" font-style="italic" font-weight="800" font-family="Inter,'Segoe UI',system-ui,sans-serif">The Analytical Engine has no pretensions whatever to originate anything. It can do whatever</text><text x="70" y="146" fill="#ffffff" font-size="21" font-style="italic" font-weight="800" font-family="Inter,'Segoe UI',system-ui,sans-serif">we know how to order it to perform.</text>
<text x="70" y="208" fill="#cbd5e1" font-size="14" font-family="Inter,'Segoe UI',system-ui,sans-serif">Mesin Analitik tidak punya pretensi untuk menciptakan apa pun. Ia hanya bisa melakukan apa yang kita tahu cara</text><text x="70" y="228" fill="#cbd5e1" font-size="14" font-family="Inter,'Segoe UI',system-ui,sans-serif">memerintahkannya.</text>
<line x1="70" y1="258" x2="930" y2="258" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="70" y="278" fill="#f59e0b" font-size="17" font-weight="900" font-family="Inter,'Segoe UI',system-ui,sans-serif">— Ada Lovelace</text>
<text x="70" y="298" fill="#64748b" font-size="11.5" font-family="Inter,'Segoe UI',system-ui,sans-serif">First Computer Programmer · original in English · translated to Bahasa Indonesia</text>
<text x="930" y="278" text-anchor="end" fill="#5b6478" font-size="11" font-family="Inter,'Segoe UI',system-ui,sans-serif">random · from 48 real developer quotes</text>

