<text x="70" y="118" fill="#ffffff" font-size="21" font-style="italic" font-weight="800" font-family="Inter,'Segoe UI',system-ui,sans-serif">Every great developer you know got there by solving problems they were unqualified to solve</text><text x="70" y="146" fill="#ffffff" font-size="21" font-style="italic" font-weight="800" font-family="Inter,'Segoe UI',system-ui,sans-serif">until they actually did it.</text>
<text x="70" y="208" fill="#cbd5e1" font-size="14" font-family="Inter,'Segoe UI',system-ui,sans-serif">Setiap developer hebat yang kamu kenal sampai di sana dengan memecahkan masalah yang awalnya tidak mereka</text><text x="70" y="228" fill="#cbd5e1" font-size="14" font-family="Inter,'Segoe UI',system-ui,sans-serif">kuasai, sampai akhirnya mereka benar-benar melakukannya.</text>
