<text x="70" y="118" fill="#ffffff" font-size="21" font-style="italic" font-weight="800" font-family="Inter,'Segoe UI',system-ui,sans-serif">Some people, when confronted with a problem, think &#39;I know, I&#39;ll use regular expressions.&#39;</text><text x="70" y="146" fill="#ffffff" font-size="21" font-style="italic" font-weight="800" font-family="Inter,'Segoe UI',system-ui,sans-serif">Now they have two problems.</text>
<text x="70" y="208" fill="#cbd5e1" font-size="14" font-family="Inter,'Segoe UI',system-ui,sans-serif">Sebagian orang saat menghadapi masalah berpikir, &#39;Aku tahu, aku pakai regex.&#39; Sekarang mereka punya dua</text><text x="70" y="228" fill="#cbd5e1" font-size="14" font-family="Inter,'Segoe UI',system-ui,sans-serif">masalah.</text>
